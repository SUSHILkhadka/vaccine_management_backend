name: CI Test Pipeline

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

env:
  CI: true

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci --no-audit # Disables time-consuming audit
        env:
          NODE_ENV: development

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
        timeout-minutes: 15 # Prevents hanging

